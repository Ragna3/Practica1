<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Búsqueda de Acta de Nacimiento</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header-bar">
        <img src="logo/logo.png" class="img-01" alt=""> 
    </div>
    
    <div class="container">
        <h2>Búsqueda</h2>
        <p>Puedes realizar la búsqueda del acta de nacimiento por cualquiera de estos métodos:</p>
        <ol>
            <li><strong>Con la Clave Única de Registro de Población (CURP).</strong></li>
            <li><strong>A través de los datos personales.</strong></li>
            <br>
            <br>
        </ol>
        
        <div class="tab-container">
            <button class="tab">Clave Única de Registro de Población</button>
            <button class="tab active">Datos Personales</button>
        </div>

        <div class="form-container">
            <div class="form-grid">
                <div class="form-group">
                    <label>Nombre(s)*</label>
                    <input type="text" placeholder="Ingresa tu nombre(s)">
                    
                    <label>Segundo Apellido</label>
                    <input type="text" placeholder="Ingresa tu segundo apellido">
                    
                    <label>Mes de Nacimiento*</label>
                    <select>
                        <option>Selecciona el mes</option>
                        <option value="enero">Enero</option>
                        <option value="febrero">Febrero</option>
                        <option value="marzo">Marzo</option>
                        <option value="abril">Abril</option>
                        <option value="mayo">Mayo</option>
                        <option value="junio">Junio</option>
                        <option value="julio">Julio</option>
                        <option value="agosto">Agosto</option>
                        <option value="septiembre">Septiembre</option>
                        <option value="octubre">Octubre</option>
                        <option value="noviembre">Noviembre</option>
                        <option value="diciembre">Diciembre</option>
                    </select>
                    
                    <label>Sexo*</label>
                    <select>
                        <option>Selecciona el sexo</option>
                        <option value="masculino">Masculino</option>
                        <option value="femenino">Femenino</option>
                    </select>
                </div>
        
                <div class="form-group">
                    <label>Primer Apellido*</label>
                    <input type="text" placeholder="Ingresa tu primer apellido">
                    
                    <label>Día de Nacimiento*</label>
                    <select>
                        <option>Selecciona el día</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                        <option value="8">8</option>
                        <option value="9">9</option>
                        <option value="10">10</option>
                        <option value="11">11</option>
                        <option value="12">12</option>
                        <option value="13">13</option>
                        <option value="14">14</option>
                        <option value="15">15</option>
                        <option value="16">16</option>
                        <option value="17">17</option>
                        <option value="18">18</option>
                        <option value="19">19</option>
                        <option value="20">20</option>
                        <option value="21">21</option>
                        <option value="22">22</option>
                        <option value="23">23</option>
                        <option value="24">24</option>
                        <option value="25">25</option>
                        <option value="26">26</option>
                        <option value="27">27</option>
                        <option value="28">28</option>
                        <option value="29">29</option>
                        <option value="30">30</option>
                        <option value="31">31</option>
                    </select>
        
                    <label>Año de Nacimiento*</label>
                    <input type="text" placeholder="Ingresa el año Ej. 1943">
                    
                    <label>Estado*</label>
                    <select>
                        <option>Selecciona el estado</option>
                        <option value="aguascalientes">Aguascalientes</option>
                        <option value="bajaCalifornia">Baja California</option>
                        <option value="bajaCaliforniaSur">Baja California Sur</option>
                        <option value="campeche">Campeche</option>
                        <option value="chiapas">Chiapas</option>
                        <option value="chihuahua">Chihuahua</option>
                        <option value="coahuila">Coahuila</option>
                        <option value="colima">Colima</option>
                        <option value="durango">Durango</option>
                        <option value="guanajuato">Guanajuato</option>
                        <option value="guerrero">Guerrero</option>
                        <option value="hidalgo">Hidalgo</option>
                        <option value="jalisco">Jalisco</option>
                        <option value="mexico">México</option>
                        <option value="michoacan">Michoacán</option>
                        <option value="morelos">Morelos</option>
                        <option value="nayarit">Nayarit</option>
                        <option value="nuevoLeon">Nuevo León</option>
                        <option value="oaxaca">Oaxaca</option>
                        <option value="puebla">Puebla</option>
                        <option value="queretaro">Querétaro</option>
                        <option value="quintanaRoo">Quintana Roo</option>
                        <option value="sanLuisPotosi">San Luis Potosí</option>
                        <option value="sinaloa">Sinaloa</option>
                        <option value="sonora">Sonora</option>
                        <option value="tabasco">Tabasco</option>
                        <option value="tamaulipas">Tamaulipas</option>
                        <option value="tlaxcala">Tlaxcala</option>
                        <option value="veracruz">Veracruz</option>
                        <option value="yucatan">Yucatán</option>
                        <option value="zacatecas">Zacatecas</option>
                    </select>
                </div>
            </div>
        </div>
        
</body>
</html>
